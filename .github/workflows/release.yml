name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - uses: Swatinem/rust-cache@v2

      # Run the full CI suite first: never publish components that fail conformance.
      - run: devenv shell -- ci
      - uses: actions/upload-artifact@v7
        with:
          name: games
          path: dist/games/*.wasm

  # Built outside Nix on purpose: a binary from the dev shell links against the Nix
  # store's glibc and won't run on a normal system.
  binary:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p tabletty
      - name: Package
        run: tar -czf "tabletty-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C target/release tabletty
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: tabletty-*.tar.gz

  publish:
    needs: [games, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
