[workspace]
resolver = "3"
members = ["sdk", "host", "engine", "tui", "cli", "games/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tabletty-sdk = { path = "sdk" }
tabletty-host = { path = "host" }
tabletty-engine = { path = "engine" }
tabletty-tui = { path = "tui" }
rps = { path = "games/rps" }
tic-tac-toe = { path = "games/tic-tac-toe" }

# Pinned to the major of the `wasmtime` CLI in the dev shell, so the host and the
# command-line tooling agree on the component format.
wasmtime = "48"
wit-bindgen = "0.62"

anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
image = { version = "0.25", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
ratatui = "0.30"
# No default features: no chafa (a C library), just the crossterm backend.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
# No text (needs system fonts) and no embedded bitmaps: game art is shapes only.
resvg = { version = "0.48", default-features = false }
# Unix only: a thread-free check that the terminal answers queries (see tui/src/probe.rs).
rustix = { version = "1", features = ["event", "stdio"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

insta = "1"
