publish = false

# cdylib is the component (built by `game-build rps`); rlib lets the host's tests
# run the same rules natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
tabletty-sdk.workspace = true
