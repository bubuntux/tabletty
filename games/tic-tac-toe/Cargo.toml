[package]
name = "tic-tac-toe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# cdylib is the component (built by `game-build tic-tac-toe`); rlib lets the host's tests
# run the same rules natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
tabletty-sdk.workspace = true
